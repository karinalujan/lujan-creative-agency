<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111111">
  <title>Page not found · Lujan Creative Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; font-family: "Geist Mono", ui-monospace, Menlo, monospace; background: #111; color: #fefefe; --muted: #bdbdbd; --pink: #fc8dc1; --rule: #454545; }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; line-height: 1.65; background: #111; color: #fefefe; }
    a { color: inherit; text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid var(--pink); outline-offset: 4px; }
    .wrap { width: min(100% - 2rem, 72rem); margin-inline: auto; }
    .skip { position: absolute; left: 1rem; top: -4rem; z-index: 10; padding: .75rem 1rem; background: #fefefe; color: #111; font-weight: 600; text-decoration: none; }
    .skip:focus { top: 1rem; }
    .site-header { padding-block: 1.25rem; border-bottom: 1px solid var(--rule); }
    .wordmark { display: inline-flex; min-height: 44px; align-items: center; color: var(--pink); font-size: .9rem; font-weight: 600; letter-spacing: .16em; text-decoration: none; }
    main { padding-block: clamp(3rem, 10vw, 7rem); }
    .eyebrow { color: var(--pink); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: .5rem 0 1.25rem; font-family: "Geist Pixel", "Geist Mono", ui-monospace, Menlo, monospace; font-size: clamp(3rem, 12vw, 7rem); font-weight: 400; line-height: .98; letter-spacing: -.07em; }
    p { max-width: 40rem; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.2rem); }
    .actions { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; }
    .btn { display: inline-flex; min-height: 44px; align-items: center; padding: 0 1.25rem; border: 2px solid #fefefe; color: #fefefe; text-decoration: none; }
    .btn:hover { background: #fefefe; color: #111; }
    .btn.primary { border-color: #dd0070; background: #dd0070; }
    .btn.primary:hover { background: #fefefe; border-color: #fefefe; color: #111; }
    .site-footer { padding-block: 1.5rem 6rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="wordmark" href="/" aria-label="Lujan Creative Agency home">LUJAN</a>
    </div>
  </header>
  <main id="main" class="wrap">
    <p class="eyebrow">Error 404</p>
    <h1>Track not found</h1>
    <p>That page isn't on the playlist. It may have moved or never existed. Open the CD menu in the bottom-right corner to browse everything, or head back home.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to home</a>
      <a class="btn" href="/#work">See the work</a>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">Lujan Creative Agency LLC · Garland, Texas</div>
  </footer>
  <script src="/assets/cd-nav.js"></script>
</body>
</html>
