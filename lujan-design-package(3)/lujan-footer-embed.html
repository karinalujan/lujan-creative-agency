<style>

.lj-foot li{list-style:none}
.lj-foot ul a{display:inline-flex;align-items:center;min-height:44px;position:relative}
.lj-foot ul a::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:2px;

.lj-foot a:hover{color:var(--lj-pink)}
.lj-foot a:focus-visible{outline:3px solid var(--lj-pink);outline-offset:0}
.lj-foot .lj-legal{grid-column:1/-1;border-top:1px solid var(--lj-rule);padding-top:1pc;color:var(--lj-soft);font-size:13px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:0.5pc 1.25pc}
@media (max-width:560px){.lj-foot .lj-in{grid-template-columns:1fr;padding:1.75pc 1pc 1.5pc}}
