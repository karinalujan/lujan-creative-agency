<script>
(function(){
  var navs=document.querySelectorAll('.lj-nav:not([data-lj-ready])');
  Array.prototype.forEach.call(navs,function(nav){
    nav.setAttribute('data-lj-ready','1');
    var btn=nav.querySelector('[data-lj-toggle]'),menu=btn&&btn.nextElementSibling;if(!btn||!menu)return;
    var id='lj-work-menu-'+Math.random().toString(36).slice(2,8);menu.id=id;btn.setAttribute('aria-controls',id);
    var li=btn.parentNode;
    function setOpen(o,f){btn.setAttribute('aria-expanded',String(o));menu.hidden=!o;if(!o&&f)btn.focus();}
    btn.addEventListener('click',function(){setOpen(btn.getAttribute('aria-expanded')!=='true');});
    li.addEventListener('keydown',function(e){if((e.key==='Escape'||e.key==='Esc')&&!menu.hidden){e.preventDefault();setOpen(false,true);}});
    document.addEventListener('click',function(e){if(!menu.hidden&&!li.contains(e.target))setOpen(false);});
    li.addEventListener('focusout',function(e){if(!menu.hidden&&e.relatedTarget&&!li.contains(e.relatedTarget))setOpen(false);});
    var here=location.pathname.replace(/\/+$/,'')||'/';
    Array.prototype.forEach.call(nav.querySelectorAll('a.lj-link'),function(a){
      try{var u=new URL(a.getAttribute('href'),location.href),p=u.pathname.replace(/\/+$/,'')||'/';
      if(u.host===location.host&&p===here&&(!u.hash||u.hash===location.hash))a.setAttribute('aria-current','page');}catch(err){}
    });
  });
})();
</script>
