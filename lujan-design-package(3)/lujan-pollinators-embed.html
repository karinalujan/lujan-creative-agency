<!-- LUJAN pollinator meadow embed v2 · Lujan Creative Agency LLC (lujan.design)
     Paste into a Webflow Embed element. Needs Geist Mono loaded site-wide.
     Each visit grows a new random meadow of Texas native wildflowers, visited by pollinators that favor them. -->
<style>
.lj-pol{--lj-bg:#111;--lj-ink:#FEFEFE;--lj-soft:#9B9B9B;--lj-rule:#2E2E2E;--lj-mag:#DD0070;--lj-pink:#FC8DC1;
  box-sizing:border-box;margin:0;padding:0;color:var(--lj-ink);font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-size:14px;line-height:1.5;max-width:75pc}
.lj-pol *{box-sizing:inherit;margin:0;padding:0;font:inherit;color:inherit;border:0;background:transparent}
.lj-pol canvas{display:block;width:100%;height:12pc;image-rendering:pixelated;border-bottom:3px dashed var(--lj-mag)}
.lj-pol .lj-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5pc 1pc;margin-top:.75pc}
.lj-pol .lj-cap{flex:1 1 20pc;color:var(--lj-soft);font-size:13px}
.lj-pol .lj-cap b{color:var(--lj-pink);font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:11px;margin-right:.25pc}
.lj-pol button{display:inline-flex;align-items:center;min-height:44px;padding:0 .75pc;border:2px solid var(--lj-ink);border-radius:0;cursor:pointer;font-size:13px}
.lj-pol button:hover{background:var(--lj-ink);color:var(--lj-bg)}
.lj-pol button:focus-visible{outline:3px solid var(--lj-pink);outline-offset:2px}
.lj-pol button[hidden]{display:none}
@media (max-width:560px){.lj-pol canvas{height:10pc}}
</style>
<figure class="lj-pol">
  <canvas aria-hidden="true"></canvas>
  <figcaption class="lj-bar">
    <span class="lj-cap" aria-live="polite"></span>
    <button type="button" class="lj-shuffle">New meadow</button>
    <button type="button" class="lj-pause" aria-pressed="false">Pause</button>
  </figcaption>
</figure>
<script>
(function(){
  var roots=document.querySelectorAll('.lj-pol:not([data-lj-ready])');
  Array.prototype.forEach.call(roots,function(root){
    root.setAttribute('data-lj-ready','1');
    var cv=root.querySelector('canvas'),ctx=cv.getContext('2d'),cap=root.querySelector('.lj-cap'),
        bShuf=root.querySelector('.lj-shuffle'),bPause=root.querySelector('.lj-pause');
    var C={G:'#3E8E4F',g:'#2C6B3A',B:'#2F5BD3',b:'#6C93F2',W:'#FFFFFF',R:'#E2462C',O:'#F27A3A',r:'#C8202E',Y:'#F7C431',
      D:'#6B1E1E',y:'#F5B800',K:'#3B2412',P:'#C2649E',p:'#E08BC0',o:'#D9741E',M:'#E9E6C8',m:'#C9D3A3',T:'#D4202F',
      h:'#2E9E6A',t:'#1F6B47',u:'#C8102E',e:'#000000',n:'#444444',w:'#BFD9E8',v:'#EDEDED',a:'#F2850F',k:'#1A1A1A',q:'#F2C230',z:'#CFE6F2'};
    var STEM=['...G...','..gG...','...G...','...Gg..','...G...'];
    var F={
      bluebonnet:{name:'Texas bluebonnet',px:['...W...','..bWb..','..BbB..','.BbBbB.','..BbB..','.BbBbB.','..BbB..','.BbBbB.','g..G..g','gg.G.gg','...G...']},
      paintbrush:{name:'Indian paintbrush',px:['...O...','..OOO..','.ORORO.','..RRR..','.ROROR.','..RRR..'].concat(STEM)},
      blanket:{name:'Indian blanket',px:['..Y.Y..','.YrrrY.','YrrDrrY','.YrrrY.','..Y.Y..'].concat(STEM)},
      susan:{name:'Black-eyed Susan',px:['..y.y..','.yyKyy.','yyKKKyy','.yyKyy.','..y.y..'].concat(STEM)},
      coneflower:{name:'Purple coneflower',px:['..ooo..','.ooooo.','pPpPpPp','P.p.p.P'].concat(STEM)},
      milkweed:{name:'Antelope horns milkweed',px:['..MmM..','.MmMmM.','MmMmMmM','.MmMmM.','..mGm..'].concat(STEM)},
      turkscap:{name:'Turk’s cap',px:['..TT...','.TTTT..','TT.TTT.','.TTTT..','..TT...','gg.G...'].concat(STEM)}
    };
    var S={
      hummingbird:{name:'ruby-throated hummingbird',speed:1.6,hover:[50,110],likes:['paintbrush','turkscap','blanket'],
        f:[['...vv.....','..vvv.....','.hhhhhh...','thhhhhue--','.hvvvuu...','...vv.....'].map(function(r,i){return i<2?r.replace(/v/g,'w'):r;}),
           ['..........','..........','.hhhhhh...','thhhhhue--','.hvvvuu...','..www.....']]},
      monarch:{name:'monarch',speed:.45,hover:[120,240],likes:['milkweed','coneflower','blanket','susan'],
        f:[['kaa.aak','aaakaaa','kaakaak','.aakaa.','..k.k..'],['..aka..','..aka..','.kakak.','..aka..','...k...']]},
      bumblebee:{name:'bumblebee',speed:.7,hover:[80,170],likes:['bluebonnet','coneflower','susan','milkweed'],
        f:[['..zz..','.kqkq.','kqkqkq','.kqkq.'],['......','.kqkqz','kqkqkq','.kqkq.']]}
    };
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches,paused=reduce,visible=true;
    var W=0,H=0,U=3,dpr=1,flowers=[],bugs=[],tick=0,raf=0;
    function rnd(a,b){return a+Math.random()*(b-a);}function pick(a){return a[Math.floor(Math.random()*a.length)];}
    function sprite(px,x,y,flip){
      for(var r=0;r<px.length;r++){var row=px[r];for(var c=0;c<row.length;c++){var ch=row[c];if(ch==='.'||!C[ch])continue;
        ctx.fillStyle=C[ch];ctx.fillRect(Math.round(x+(flip?row.length-1-c:c))*U*dpr,Math.round(y+r)*U*dpr,U*dpr,U*dpr);}}
    }
    function size(){var r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;U=r.width<600?3:r.width<1000?4:5;
      cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);W=Math.floor(r.width/U);H=Math.floor(r.height/U);}
    function grow(){
      var kinds=Object.keys(F),cast=[];
      if(Math.random()<.8)cast.push('hummingbird');
      for(var i=0,n=1+(Math.random()<.5?1:0);i<n;i++)cast.push('monarch');
      for(i=0,n=1+Math.floor(Math.random()*3);i<n;i++)cast.push('bumblebee');
      var need=[];cast.forEach(function(s){need.push(pick(S[s].likes));});
      var count=Math.max(6,Math.min(16,Math.floor(W/11))),types=need.slice(0,count);
      while(types.length<count)types.push(pick(kinds));
      types.sort(function(){return Math.random()-.5;});
      var gap=W/count;flowers=types.map(function(t,i){
        var px=F[t].px.slice(),extra=Math.floor(rnd(0,Math.max(1,H*.35)));for(var k=0;k<extra;k++)px.push('...G...');
        var x=Math.round(i*gap+rnd(1,Math.max(2,gap-8))),y=H-px.length;
        return {type:t,px:px,x:x,y:y,hx:x+3,hy:y};
      });
      bugs=cast.map(function(s){return {s:s,x:rnd(0,W),y:rnd(2,H*.4),tx:0,ty:0,state:'fly',timer:0,flip:false,ph:rnd(0,6.28),target:null};});
      bugs.forEach(choose);
      if(reduce)bugs.forEach(function(b){b.x=b.tx;b.y=b.ty;});
      var inBloom=[],seen={};flowers.forEach(function(f){if(!seen[f.type]){seen[f.type]=1;inBloom.push(F[f.type].name);}});
      var vis=[],sv={};cast.forEach(function(s){if(!sv[s]){sv[s]=1;vis.push(S[s].name+(cast.filter(function(x){return x===s;}).length>1?'s':''));}});
      cap.innerHTML='<b>In bloom:</b> '+inBloom.join(', ')+' · <b>Visiting:</b> '+vis.join(', ');
    }
    function choose(b){
      var sp=S[b.s],liked=flowers.filter(function(f){return sp.likes.indexOf(f.type)>-1&&f!==b.target;});
      var pool=liked.length&&Math.random()<.8?liked:flowers.filter(function(f){return f!==b.target;});
      b.target=pick(pool.length?pool:flowers);var w=sp.f[0][0].length,h=sp.f[0].length;
      b.tx=b.target.hx-(b.s==='hummingbird'?w-1:Math.floor(w/2));b.ty=b.target.hy-h+(b.s==='hummingbird'?2:0);b.state='fly';
    }
    function step(){
      tick++;
      bugs.forEach(function(b){
        var sp=S[b.s],dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy);
        if(b.state==='fly'){
          if(d<1){b.state='hover';b.timer=Math.round(rnd(sp.hover[0],sp.hover[1]));}
          else{var v=Math.min(sp.speed,d);b.x+=dx/d*v;b.y+=dy/d*v;
            if(b.s==='monarch')b.y+=Math.sin(tick*.15+b.ph)*.35;if(b.s==='bumblebee')b.y+=rnd(-.3,.3);
            if(Math.abs(dx)>.5)b.flip=dx<0;}
        }else{b.y=b.ty+(b.s==='hummingbird'?Math.sin(tick*.3+b.ph)*.4:0);if(--b.timer<=0)choose(b);}
      });
    }
    function draw(){
      ctx.clearRect(0,0,cv.width,cv.height);
      flowers.forEach(function(f){sprite(f.px,f.x,f.y,false);});
      bugs.forEach(function(b){var sp=S[b.s],rate=b.s==='hummingbird'?2:b.s==='bumblebee'?3:10;
        var fr=paused?0:Math.floor(tick/rate)%2;sprite(sp.f[fr],b.x,b.y,b.flip);});
    }
    function loop(){raf=0;if(paused||!visible)return;step();draw();raf=requestAnimationFrame(loop);}
    function start(){if(!raf&&!paused&&visible)raf=requestAnimationFrame(loop);}
    function setPaused(p){paused=p;bPause.setAttribute('aria-pressed',String(p));bPause.textContent=p?'Play':'Pause';if(!p)start();else draw();}
    bShuf.addEventListener('click',function(){grow();draw();});
    bPause.addEventListener('click',function(){setPaused(!paused);});
    if(reduce)bPause.hidden=true;
    if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;start();}).observe(cv);
    document.addEventListener('visibilitychange',function(){visible=!document.hidden;start();});
    var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){size();grow();draw();},200);});
    size();grow();draw();start();
  });
})();
</script>
