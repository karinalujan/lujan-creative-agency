<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lujan Creative Agency | The Garden Gate</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#3B5249">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lujan Design">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="lujan-accessible-mode">

  <main class="lujan-brand-card">
    <h1>Lujan Creative Agency</h1>
    <p>Because design is everything. Built with empathy, transparency, and zero red tape.</p>
    
    <button class="lujan-btn" id="toggle-accessibility">Toggle Readable Typography & Luminance</button>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js', { scope: './' })
          .catch((err) => console.warn('Service worker error:', err));
      });
    }

    const toggleBtn = document.getElementById('toggle-accessibility');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('lujan-accessible-mode');
      toggleBtn.textContent = document.body.classList.contains('lujan-accessible-mode') 
        ? "Standard Mode" 
        : "Enable Accessible Mode";
    });
  </script>
  <script src="../assets/cd-nav.js"></script>
</body>
</html>
